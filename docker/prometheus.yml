# Prometheus scrape configuration for the S&P 500 prediction stack.
scrape_configs:
  - job_name: "fastapi"
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["api:8000"]

  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
